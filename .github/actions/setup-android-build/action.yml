# SPDX-License-Identifier: GPL-3.0-or-later
name: Set up Android build
description: >-
  Installs the JDK, the Rust toolchain with the Android targets, cargo-ndk and the pinned
  Android NDK and SDK platform, with caches for Cargo, the NDK and Gradle.

# Actions are pinned to full commit SHAs (Dependabot keeps them current) so a moved tag cannot
# change what runs in the build.

inputs:
  gradle-cache-read-only:
    description: Restore the Gradle cache without saving it.
    default: "true"
  caches:
    description: >-
      Restore build caches. Release builds turn this off so nothing written by other workflow
      runs can end up in signed APKs.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: 25

    - name: Read pinned Android versions
      id: versions
      shell: bash
      run: |
        catalog=android/gradle/libs.versions.toml
        read_version() { sed -n "s/^$1 = \"\(.*\)\"/\1/p" "$catalog"; }
        echo "ndk=$(read_version ndk)" >> "$GITHUB_OUTPUT"
        echo "platform=$(read_version compileSdk).$(read_version compileSdkMinor)" >> "$GITHUB_OUTPUT"

    - name: Restore Android NDK
      id: ndk-cache
      if: inputs.caches == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.ANDROID_HOME }}/ndk/${{ steps.versions.outputs.ndk }}
        key: android-ndk-${{ runner.os }}-${{ steps.versions.outputs.ndk }}

    - name: Install Android NDK and SDK platform
      shell: bash
      run: |
        packages=("platforms;android-${{ steps.versions.outputs.platform }}")
        if [ "${{ steps.ndk-cache.outputs.cache-hit }}" != "true" ]; then
          packages+=("ndk;${{ steps.versions.outputs.ndk }}")
        fi
        sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        # `yes` is killed by SIGPIPE once sdkmanager exits; keep that from failing the step under pipefail.
        (yes || true) | "$sdkmanager" --licenses > /dev/null
        if ! (yes || true) | "$sdkmanager" --install "${packages[@]}" > "$RUNNER_TEMP/sdkmanager.log" 2>&1; then
          cat "$RUNNER_TEMP/sdkmanager.log"
          exit 1
        fi

    - name: Install Rust
      shell: bash
      working-directory: core
      run: rustup show active-toolchain || rustup toolchain install

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.caches == 'true'
      with:
        workspaces: core
        shared-key: android
        # Saved even when a later step fails, so the next run does not compile everything again.
        cache-on-failure: true

    - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: cargo-ndk

    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
        cache-disabled: ${{ inputs.caches != 'true' }}
