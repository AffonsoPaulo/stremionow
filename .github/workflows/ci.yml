# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs every job, as a forced push does (see the changes job).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # On pull requests, paths-filter lists the changed files through the API.
      pull-requests: read
    # A forced push (a rewritten history) has no previous commit left to compare with, and a run
    # started by hand has none at all: both run every job.
    outputs:
      core: ${{ steps.everything.outputs.run || steps.filter.outputs.core }}
      android: ${{ steps.everything.outputs.run || steps.filter.outputs.android }}
      desktop: ${{ steps.everything.outputs.run || steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history lets paths-filter diff pushes locally, without fetching with a token.
          fetch-depth: 0
      - id: everything
        if: github.event_name == 'workflow_dispatch' || github.event.forced
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: steps.everything.outputs.run != 'true'
        with:
          filters: |
            core:
              - 'core/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'core/**'
              - 'design/**'
              - 'l10n/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            # The desktop app builds on the shared modules of android/ (docs/adr/0006-shared-ui.md).
            desktop:
              - 'desktop/**'
              - 'android/**'
              - 'core/**'
              - 'design/**'
              - 'l10n/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'

  core-lint:
    name: Core lint
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    env:
      # Lint and tests need only the host toolchain, not the Android targets of rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Saved even when a later step fails, so the next run does not compile everything again.
          cache-on-failure: true
          workspaces: core
          shared-key: lint
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  core-test:
    name: Core tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: core
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Saved even when a later step fails, so the next run does not compile everything again.
          cache-on-failure: true
          workspaces: core
          shared-key: test
      - name: Test
        run: cargo test --workspace --locked

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
        with:
          # Only builds of main write the shared Gradle cache; pull requests reuse it.
          gradle-cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check Kotlin formatting
        working-directory: android
        run: ./gradlew spotlessCheck --console=plain
      - name: Lint, test and build debug APKs
        working-directory: android
        # One ABI is enough to check; releases build them all (see androidAbis in build-logic).
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug -Pstremionow.abis=arm64-v8a --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apks
          path: android/app-*/build/outputs/apk/debug/*.apk
          retention-days: 7
          compression-level: 0

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      # The desktop builds the core for the host only, not the Android targets of rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: stable
      HOMEBREW_NO_AUTO_UPDATE: 1
      # The Rust core in the dev profile, which compiles several times faster than release.
      CARGO_PROFILE: -Pstremionow.cargo.profile=dev
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Saved even when a later step fails, so the next run does not compile everything again.
          cache-on-failure: true
          workspaces: core
          # The cache key also carries the runner's OS and architecture.
          shared-key: desktop
      # libmpv comes from the system on Linux and macOS (Windows downloads a pinned build), plus
      # what the checks need: a Secret Service (GNOME Keyring over a private D-Bus session) and
      # a virtual display with Mesa's software OpenGL for the smoke test.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libmpv2 libsecret-1-0 libsecret-tools gnome-keyring dbus xvfb xauth libgl1-mesa-dri libegl-mesa0
      - name: Install libmpv
        if: runner.os == 'macOS'
        run: brew install mpv
      # The desktop build includes android/, whose projects need the SDK platform to configure;
      # the NDK and cargo-ndk are not needed.
      - name: Install Android SDK platform
        run: |
          catalog=android/gradle/libs.versions.toml
          read_version() { sed -n "s/^$1 = \"\(.*\)\"/\1/p" "$catalog"; }
          platform="platforms;android-$(read_version compileSdk).$(read_version compileSdkMinor)"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ "$RUNNER_OS" = Windows ]; then sdkmanager="$sdkmanager.bat"; fi
          # `yes` is killed by SIGPIPE once sdkmanager exits; keep that from failing the step under pipefail.
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          if ! (yes || true) | "$sdkmanager" --install "$platform" > "$RUNNER_TEMP/sdkmanager.log" 2>&1; then
            cat "$RUNNER_TEMP/sdkmanager.log"
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Formatting does not depend on the OS: check it once.
      - name: Check Kotlin formatting
        if: runner.os == 'Linux'
        working-directory: desktop
        run: ./gradlew spotlessCheck --console=plain
      - name: Compile the desktop app and run the shared modules' desktop tests
        working-directory: desktop
        run: ./gradlew :app:compileKotlin :android:ui:desktopTest :android:player:desktopTest $CARGO_PROFILE --console=plain
      # Round trips through the real store: DPAPI, the login keychain or the Secret Service. They
      # skip where the store is missing; here they must run, and --rerun keeps Gradle from
      # reusing a result from the step above or the build cache.
      - name: Secret store tests
        working-directory: desktop
        env:
          STREMIONOW_REQUIRE_SECRET_STORE: "true"
        run: |
          run=()
          if [ "$RUNNER_OS" = Linux ]; then run=(../.github/scripts/with-secret-service.sh); fi
          "${run[@]}" ./gradlew :android:ui:desktopTest --tests '*.SecretBackendTest' --rerun $CARGO_PROFILE --console=plain
      # Starts the app, composes its window, plays a generated test pattern through libmpv in the
      # player's window and exits (see SmokeTest.kt).
      - name: Smoke test
        working-directory: desktop
        run: |
          run=()
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"); fi
          "${run[@]}" ./gradlew :app:run --args=--smoke-test $CARGO_PROFILE --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: desktop-test-reports-${{ matrix.os }}
          path: android/*/build/reports/tests/desktopTest/
          retention-days: 7

  license-headers:
    name: License headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every source file declares its license
        run: |
          missing=$(git ls-files '*.rs' '*.kt' '*.kts' | xargs -r grep -L 'SPDX-License-Identifier: GPL-3.0-or-later' || true)
          if [ -n "$missing" ]; then
            echo "Files without the SPDX header:"
            echo "$missing"
            exit 1
          fi
