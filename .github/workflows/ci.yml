# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'core/**'
              - 'design/**'
              - 'l10n/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  core-lint:
    name: Core lint
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    env:
      # Lint and tests need only the host toolchain, not the Android targets of rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: lint
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  core-test:
    name: Core tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: core
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: test
      - name: Test
        run: cargo test --workspace --locked

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android-build
        with:
          # Only builds of main write the shared Gradle cache; pull requests reuse it.
          gradle-cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build debug APKs
        working-directory: android
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: android/app-*/build/outputs/apk/debug/*.apk
          retention-days: 7
          compression-level: 0

  license-headers:
    name: License headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Every source file declares its license
        run: |
          missing=$(git ls-files '*.rs' '*.kt' '*.kts' | xargs -r grep -L 'SPDX-License-Identifier: GPL-3.0-or-later' || true)
          if [ -n "$missing" ]; then
            echo "Files without the SPDX header:"
            echo "$missing"
            exit 1
          fi
