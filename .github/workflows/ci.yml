# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history lets paths-filter diff pushes locally, without fetching with a token.
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'core/**'
              - 'design/**'
              - 'l10n/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  core-lint:
    name: Core lint
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    env:
      # Lint and tests need only the host toolchain, not the Android targets of rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          shared-key: lint
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  core-test:
    name: Core tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: core
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          shared-key: test
      - name: Test
        run: cargo test --workspace --locked

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
        with:
          # Only builds of main write the shared Gradle cache; pull requests reuse it.
          gradle-cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check Kotlin formatting
        working-directory: android
        run: ./gradlew spotlessCheck --console=plain
      - name: Lint and build debug APKs
        working-directory: android
        run: ./gradlew lintDebug assembleDebug --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apks
          path: android/app-*/build/outputs/apk/debug/*.apk
          retention-days: 7
          compression-level: 0

  license-headers:
    name: License headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every source file declares its license
        run: |
          missing=$(git ls-files '*.rs' '*.kt' '*.kts' | xargs -r grep -L 'SPDX-License-Identifier: GPL-3.0-or-later' || true)
          if [ -n "$missing" ]; then
            echo "Files without the SPDX header:"
            echo "$missing"
            exit 1
          fi
