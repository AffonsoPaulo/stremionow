# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android-build

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STREMIONOW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "STREMIONOW_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        working-directory: android
        env:
          STREMIONOW_KEYSTORE_PASSWORD: ${{ secrets.STREMIONOW_KEYSTORE_PASSWORD }}
          STREMIONOW_KEY_ALIAS: ${{ secrets.STREMIONOW_KEY_ALIAS }}
          STREMIONOW_KEY_PASSWORD: ${{ secrets.STREMIONOW_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app-mobile/build/outputs/apk/release/app-mobile-release.apk "dist/StremioNow-${GITHUB_REF_NAME}-phone.apk"
          cp android/app-tv/build/outputs/apk/release/app-tv-release.apk "dist/StremioNow-${GITHUB_REF_NAME}-tv.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "StremioNow ${GITHUB_REF_NAME}"
