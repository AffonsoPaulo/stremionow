# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The build job runs third-party actions but never sees a secret. The publish job holds the
# signing key and runs only first-party actions and tools from the Android SDK.

jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
        with:
          caches: "false"
      - name: Build unsigned release APKs
        working-directory: android
        run: ./gradlew assembleRelease --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apks
          path: |
            android/app-mobile/build/outputs/apk/release/*.apk
            android/app-tv/build/outputs/apk/release/*.apk
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apks
          path: unsigned

      - name: Sign APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.STREMIONOW_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STREMIONOW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STREMIONOW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STREMIONOW_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. See docs/RELEASING.md."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"

          mkdir -p dist
          sign() {
            "$build_tools/apksigner" sign \
              --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "$2" "$1"
            "$build_tools/apksigner" verify "$2"
          }
          # app-mobile-arm64-v8a-release-unsigned.apk -> StremioNow-v1.0.0-phone-arm64-v8a.apk
          for apk in $(find unsigned -name '*-release-unsigned.apk'); do
            rest="$(basename "$apk" -release-unsigned.apk)"; rest="${rest#app-}"
            device="${rest%%-*}"; abi="${rest#*-}"
            [ "$device" = mobile ] && device=phone
            sign "$apk" "dist/StremioNow-${GITHUB_REF_NAME}-${device}-${abi}.apk"
          done
          rm -f "$keystore"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "StremioNow ${GITHUB_REF_NAME}"
