# Android devices with 16 KB memory pages (and Google Play) require shared libraries whose
# segments are aligned to 16 KB. NDK 27 still defaults to 4 KB, so ask the linker for it.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
