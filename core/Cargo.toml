[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/AffonsoPaulo/stremionow"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
stremionow-protocol = { path = "crates/protocol" }
stremionow-addons = { path = "crates/addons" }
stremionow-library = { path = "crates/library" }
stremionow-ranking = { path = "crates/ranking" }
stremionow-sync = { path = "crates/sync" }
stremionow-torrent = { path = "crates/torrent" }
stremionow-markers = { path = "crates/markers" }

uniffi = "0.32.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
percent-encoding = "2.3.2"
thiserror = "2.0.21"
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "json", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.12"
rusqlite = { version = "0.42.0", features = ["bundled"] }
log = "0.4.35"
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
