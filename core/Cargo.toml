[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/AffonsoPaulo/stremionow"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
stremionow-protocol = { path = "crates/protocol" }
stremionow-addons = { path = "crates/addons" }
stremionow-library = { path = "crates/library" }
stremionow-ranking = { path = "crates/ranking" }
stremionow-sync = { path = "crates/sync" }
stremionow-torrent = { path = "crates/torrent" }
stremionow-markers = { path = "crates/markers" }
stremionow-curation = { path = "crates/curation" }

uniffi = "0.32.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
percent-encoding = "2.3.2"
thiserror = "2.0.21"
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "json", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.12"
# Already in the tree as rustls's crypto provider; used directly for SHA-256 manifest fingerprints.
ring = { version = "0.17.14", default-features = false }
rusqlite = { version = "0.42.0", features = ["bundled"] }
log = "0.4.35"
tempfile = "3.27.0"
wiremock = "0.6.5"
librqbit = { version = "9.1.0", default-features = false }
# `sha1-ring` selects librqbit's SHA-1 backend (aws-lc-rs, despite the name) without librqbit's
# `rust-tls` feature, which would also switch reqwest's TLS to aws-lc-rs (the workspace uses ring).
librqbit-core = { version = "9.1.0", default-features = false, features = ["sha1-ring"] }
# Builds aws-lc on Windows x86_64 with the assembly objects shipped in the crate instead of
# requiring NASM on the build machine. No effect on other targets.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["prebuilt-nasm"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
tokio-util = { version = "0.7.20", features = ["io"] }
getrandom = "0.4.3"
# Serving to other devices (ADR 0008).
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
spake2 = "0.4.0"
mdns-sd = "0.21.7"
if-addrs = "0.15.0"
# Windows: adapter types, gateways and the gateway's MAC address, to tell the home network from
# others (ADR 0008), and the space files take and the space left on a disk, for the torrent
# cache. Already in the tree through if-addrs and tokio.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }
# Unix: the space left on a disk (statvfs), checked before a torrent is added. Already in the
# tree through tempfile.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
# The official watched-videos bitfield of library items (ADR 0012): zlib with the pure-Rust
# backend and standard base64, as stremio-core's `stremio-watched-bitfield`. Both are already
# in the tree, through librqbit and hyper-util.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
