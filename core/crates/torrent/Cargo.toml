[features]
# Lets `StreamServer::serve_loopback` listen on 127.0.0.1, for the emulator harness
# (`examples/serve.rs`). The apps never enable it.
dev-loopback = []

[[example]]
name = "serve"
required-features = ["dev-loopback"]

