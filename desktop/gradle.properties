org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# libmpv for Windows x86_64 from https://github.com/shinchiro/mpv-winbuild-cmake/releases.
# The project publishes daily builds and keeps about 30 of them, so a pin stops downloading after
# a month: bump the three values together, or point stremionow.libmpv.url at a mirror of the
# same file (the SHA-256 still has to match).
stremionow.libmpv.url=https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z
stremionow.libmpv.sha256=273c079b11ea5575822f972756f4c9a71149a5c10130353abeb8586738938452

# Mozilla CA store for mpv's TLS verification, as published by curl. Same file as
# android/player/src/main/assets/cacert.pem (see third_party/certificates/README.md).
stremionow.cacert.url=https://curl.se/ca/cacert-2026-11-05.pem
stremionow.cacert.sha256=427c064216761a1e72a8b30f0d954d08cb6e4435a82091fb865afd20c8497285
